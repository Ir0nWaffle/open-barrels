<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open Barrels</title>
  <meta name="description" content="Free, open-source barrel racing jackpot and show manager: entries, draw, times, divisions and payouts.">
  <meta name="theme-color" content="#8f2a1d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Open Barrels</span>
    </div>
    <label class="event-pick">
      <span class="sr-only">Current event</span>
      <select id="eventSelect"></select>
    </label>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="setup">Setup</button>
    <button role="tab" data-tab="entries">Entries</button>
    <button role="tab" data-tab="run">Run</button>
    <button role="tab" data-tab="results">Results</button>
  </nav>

  <main id="main"></main>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="menu" class="menu" hidden></div>
  <dialog id="dlg"></dialog>
  <div id="printArea"></div>

  <noscript>Open Barrels needs JavaScript turned on.</noscript>
  <script src="js/config.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
